<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1600" height="900" viewBox="0 0 1600 900"
     preserveAspectRatio="xMidYMid slice" overflow="hidden"
     role="img" aria-labelledby="title description">
  <title id="title">山谷 · 风息</title>
  <desc id="description">空阔的青灰天空下，纤细卷云向左下方漂移，三重云海缓缓穿过静止的赭灰山脊与左下方岩壁。雾色独立呼吸，所有漂移单向无缝循环。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8eafb5"/>
      <stop offset=".38" stop-color="#bbceca"/>
      <stop offset=".64" stop-color="#e0e1cc"/>
      <stop offset="1" stop-color="#a9c0b8"/>
    </linearGradient>

    <linearGradient id="cirrus-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop stop-color="#faf8e9" stop-opacity="0"/>
      <stop offset=".15" stop-color="#faf8e9" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#faf8e9"/>
      <stop offset=".85" stop-color="#faf8e9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#faf8e9" stop-opacity="0"/>
    </linearGradient>

    <!-- Vertical gradients have identical values at the two tile boundaries. -->
    <linearGradient id="far-body" x1="0" y1="472" x2="0" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4f0dc" stop-opacity=".08"/>
      <stop offset=".23" stop-color="#f4f0dc" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#e8ead8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#d6e0d3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="far-shade" x1="0" y1="519" x2="0" y2="601" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9fb8ad" stop-opacity="0"/>
      <stop offset=".38" stop-color="#9fb8ad" stop-opacity=".13"/>
      <stop offset="1" stop-color="#9fb8ad" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="middle-body" x1="0" y1="518" x2="0" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2efda" stop-opacity=".66"/>
      <stop offset=".3" stop-color="#e2e6d5" stop-opacity=".86"/>
      <stop offset=".65" stop-color="#b8cdc1" stop-opacity=".46"/>
      <stop offset="1" stop-color="#b8cdc1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="middle-shade" x1="0" y1="565" x2="0" y2="699" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8facaa" stop-opacity="0"/>
      <stop offset=".45" stop-color="#8facaa" stop-opacity=".18"/>
      <stop offset="1" stop-color="#8facaa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="near-body" x1="0" y1="592" x2="0" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3f0de"/>
      <stop offset=".2" stop-color="#e7e9d9"/>
      <stop offset=".49" stop-color="#cfded1"/>
      <stop offset=".8" stop-color="#afc9be"/>
      <stop offset="1" stop-color="#96b7ad"/>
    </linearGradient>
    <linearGradient id="near-shade" x1="0" y1="681" x2="0" y2="962" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6f9996" stop-opacity="0"/>
      <stop offset=".26" stop-color="#7ea7a0" stop-opacity=".21"/>
      <stop offset=".56" stop-color="#7ba49b" stop-opacity=".16"/>
      <stop offset="1" stop-color="#89b1a4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="near-silk" x1="0" y1="738" x2="0" y2="897" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8f4df" stop-opacity=".21"/>
      <stop offset=".6" stop-color="#edf0da" stop-opacity=".13"/>
      <stop offset="1" stop-color="#edf0da" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters operate AFTER tiling, in a fixed, overscanned coordinate field.
         Thus no independently filtered tile edges can leave a vertical seam. -->
    <filter id="far-air" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse"
            x="-80" y="432" width="1760" height="548" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".005 .029" numOctaves="3" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="2.1"/>
    </filter>
    <filter id="middle-air" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse"
            x="-80" y="470" width="1760" height="510" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".006 .034" numOctaves="3" seed="29" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="near-air" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse"
            x="-80" y="552" width="1760" height="428" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".007 .038" numOctaves="3" seed="43" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="26" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation=".85"/>
    </filter>
    <filter id="soft-cloud-shade" filterUnits="userSpaceOnUse"
            x="-64" y="460" width="3648" height="740" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <!-- P = 2880. Each boundary has matching height and tangent. -->
    <pattern id="far-sea" width="2880" height="1200" patternUnits="userSpaceOnUse" patternContentUnits="userSpaceOnUse">
      <path fill="url(#far-body)" d="M0 505
        C150 494 318 472 500 483 C720 496 803 524 1070 508
        C1250 497 1370 484 1556 497 C1780 513 1990 522 2210 501
        C2450 478 2730 516 2880 505 V1200 H0Z"/>
      <g filter="url(#soft-cloud-shade)">
        <use href="#far-shadow-sheet" x="-2880"/>
        <path id="far-shadow-sheet" fill="url(#far-shade)" d="M0 542
        C170 540 345 520 560 527 C850 536 900 557 1190 543
        C1470 529 1600 528 1850 541 C2200 559 2710 544 2880 542
        V1200 H0Z"/>
        <use href="#far-shadow-sheet" x="2880"/>
      </g>
    </pattern>

    <!-- P = 3200. Light and shade are periodic, as well as the silhouette. -->
    <pattern id="middle-sea" width="3200" height="1200" patternUnits="userSpaceOnUse" patternContentUnits="userSpaceOnUse">
      <path fill="url(#middle-body)" d="M0 568
        C150 558 294 521 520 531 C730 540 815 578 1050 556
        C1270 535 1450 534 1670 564 C1890 594 2020 579 2210 552
        C2430 520 2600 529 2780 553 C2920 572 3050 578 3200 568
        V1200 H0Z"/>
      <g filter="url(#soft-cloud-shade)">
        <use href="#middle-shadow-sheet" x="-3200"/>
        <path id="middle-shadow-sheet" fill="url(#middle-shade)" d="M0 604
        C160 600 390 577 632 593 C870 609 1098 627 1370 606
        C1610 587 1840 582 2070 602 C2360 627 2710 616 2920 605
        C3030 599 3040 608 3200 604 V1200 H0Z"/>
        <use href="#middle-shadow-sheet" x="3200"/>
      </g>
      <path fill="#fff8e3" opacity=".2" d="M0 568
        C150 558 294 521 520 531 C730 540 815 578 1050 556
        C1270 535 1450 534 1670 564 C1890 594 2020 579 2210 552
        C2430 520 2600 529 2780 553 C2920 572 3050 578 3200 568
        L3200 569.2 C3050 579.2 2920 573.2 2780 554.2
        C2600 530.2 2430 521.2 2210 553.2 C2020 580.2 1890 595.2 1670 565.2
        C1450 535.2 1270 536.2 1050 557.2 C815 579.2 730 541.2 520 532.2
        C294 522.2 150 559.2 0 569.2Z"/>
    </pattern>

    <!-- P = 3520. Highlights are narrow filled ribbons, never cloud outlines. -->
    <pattern id="near-sea" width="3520" height="1200" patternUnits="userSpaceOnUse" patternContentUnits="userSpaceOnUse">
      <path fill="url(#near-body)" d="M0 666
        C160 663 254 621 446 615 C638 609 736 650 910 659
        C1140 671 1300 613 1486 612 C1705 610 1770 645 1980 641
        C2200 637 2300 599 2494 605 C2690 611 2768 648 2962 662
        C3180 678 3360 669 3520 666 V1200 H0Z"/>
      <g filter="url(#soft-cloud-shade)">
        <use href="#near-shadow-sheet" x="-3520"/>
        <path id="near-shadow-sheet" fill="url(#near-shade)" d="M0 712
        C230 731 380 699 642 713 C877 726 990 755 1240 741
        C1512 726 1680 681 1940 701 C2230 724 2350 761 2615 742
        C2910 721 3290 693 3520 712 V1200 H0Z"/>
        <use href="#near-shadow-sheet" x="3520"/>
      </g>
      <path fill="url(#near-silk)" d="M0 774
        C180 767 384 748 605 762 C884 780 991 808 1246 791
        C1541 771 1685 734 1926 755 C2211 780 2328 800 2604 781
        C2914 760 3340 781 3520 774 L3520 779
        C3340 786 2914 774 2604 792 C2328 810 2211 790 1926 764
        C1685 743 1541 781 1246 801 C991 818 884 789 605 770
        C384 756 180 772 0 779Z"/>
      <path fill="#eff0d9" opacity=".1" d="M0 856
        C200 859 388 833 666 836 C990 840 1150 874 1420 866
        C1710 857 1910 824 2210 834 C2580 846 2920 873 3200 860
        C3330 854 3320 853 3520 856 L3520 860
        C3320 857 3330 862 3200 868 C2920 881 2580 855 2210 843
        C1910 833 1710 867 1420 876 C1150 884 990 849 666 844
        C388 841 200 863 0 860Z"/>
      <path fill="#fff8df" opacity=".58" d="M0 666
        C160 663 254 621 446 615 C638 609 736 650 910 659
        C1140 671 1300 613 1486 612 C1705 610 1770 645 1980 641
        C2200 637 2300 599 2494 605 C2690 611 2768 648 2962 662
        C3180 678 3360 669 3520 666 L3520 667.6
        C3360 670.6 3180 679.6 2962 663.6 C2768 649.6 2690 612.6 2494 606.6
        C2300 600.6 2200 638.6 1980 642.6 C1770 646.6 1705 611.6 1486 613.6
        C1300 614.6 1140 672.6 910 660.6 C736 651.6 638 610.6 446 616.6
        C254 622.6 160 664.6 0 667.6Z"/>
    </pattern>

    <linearGradient id="ridge-color" x1="0" y1="430" x2="0" y2="689" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93927e"/>
      <stop offset=".45" stop-color="#919987"/>
      <stop offset="1" stop-color="#b1c2af"/>
    </linearGradient>
    <linearGradient id="ridge-extinction" x1="0" y1="451" x2="0" y2="681" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity=".87"/>
      <stop offset=".48" stop-color="white" stop-opacity=".63"/>
      <stop offset=".82" stop-color="white" stop-opacity=".15"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="ridge-haze" maskUnits="userSpaceOnUse" x="380" y="410" width="1300" height="510" style="mask-type:alpha">
      <path fill="url(#ridge-extinction)" d="M380 410H1680V920H380Z"/>
    </mask>

    <linearGradient id="rock-color" x1="92" y1="531" x2="315" y2="934" gradientUnits="userSpaceOnUse">
      <stop stop-color="#77715e"/>
      <stop offset=".38" stop-color="#5e6253"/>
      <stop offset="1" stop-color="#384941"/>
    </linearGradient>
    <linearGradient id="rock-light" x1="94" y1="546" x2="226" y2="903" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c0ad82" stop-opacity=".35"/>
      <stop offset=".52" stop-color="#9c9573" stop-opacity=".12"/>
      <stop offset="1" stop-color="#9c9573" stop-opacity="0"/>
    </linearGradient>
    <filter id="stone-grain" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".075 .19" numOctaves="3" seed="71" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".15"/>
      </feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in"/>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>

    <linearGradient id="mist-color" x1="0" y1="0" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bddbd8" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#c6ded4" stop-opacity=".55"/>
      <stop offset=".76" stop-color="#d4e4d4" stop-opacity=".35"/>
      <stop offset="1" stop-color="#a8cebf" stop-opacity=".24"/>
    </linearGradient>
  </defs>

  <!-- 1 / Sky: still, open, with no objects in the upper 400 px except cirrus. -->
  <path id="sky-layer" fill="url(#sky)" d="M0 0H1600V900H0Z"/>

  <!-- 2 / Cirrus: independent, faded at both ends; every reset is off canvas.
       Translation follows the same -12 degree light axis as the long paths. -->
  <g id="cirrus-layer" fill="none" stroke="url(#cirrus-fade)" stroke-linecap="round">
    <path opacity=".32" stroke-width="1.7" d="M0 0C290 -44 778 -198 1180 -250.82">
      <animateTransform attributeName="transform" type="translate" from="1740 -59.85" to="-1380 603.33"
                        dur="151s" begin="-92.92s" calcMode="linear" repeatCount="indefinite"/>
    </path>
    <path opacity=".23" stroke-width="1.15" d="M0 0C290 -43 676 -179 1030 -218.94">
      <animateTransform attributeName="transform" type="translate" from="1740 10.15" to="-1230 641.45"
                        dur="179s" begin="-81.97s" calcMode="linear" repeatCount="indefinite"/>
    </path>
    <path opacity=".28" stroke-width="2.1" d="M0 0C410 -61 943 -262 1390 -295.46">
      <animateTransform attributeName="transform" type="translate" from="1740 75.15" to="-1590 782.97"
                        dur="197s" begin="-44.96s" calcMode="linear" repeatCount="indefinite"/>
    </path>
    <path opacity=".16" stroke-width="1.25" d="M0 0C354 -57 824 -226 1230 -261.45">
      <animateTransform attributeName="transform" type="translate" from="1740 -129.85" to="-1430 543.96"
                        dur="227s" begin="-154.68s" calcMode="linear" repeatCount="indefinite"/>
    </path>
    <path opacity=".18" stroke-width="1.45" d="M0 0C321 -50 752 -199 1110 -235.94">
      <animateTransform attributeName="transform" type="translate" from="1740 -34.85" to="-1310 613.45"
                        dur="257s" begin="-91.85s" calcMode="linear" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 3 / Distant mist. Rect width = P + 1760: 80 px overscan at either end. -->
  <g id="far-cloud-layer" filter="url(#far-air)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-2880 0"
                        dur="211s" begin="-37s" calcMode="linear" repeatCount="indefinite"/>
      <rect x="-80" y="0" width="4640" height="1100" fill="url(#far-sea)"/>
    </g>
  </g>

  <!-- 4 / Middle cloud sea. -->
  <g id="middle-cloud-layer" filter="url(#middle-air)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-3200 0"
                        dur="173s" begin="-59s" calcMode="linear" repeatCount="indefinite"/>
      <rect x="-80" y="0" width="4960" height="1100" fill="url(#middle-sea)"/>
    </g>
  </g>

  <!-- 5 / Ridge: absolutely still; aerial extinction hides the lower slopes. -->
  <g id="ridge-layer" mask="url(#ridge-haze)">
    <path fill="url(#ridge-color)" d="M410 691L526 613 577 605 641 559 675 552
      714 530 761 519 800 489 824 495 858 474 885 471 931 450 955 455
      993 437 1014 442 1048 430 1074 445 1101 452 1134 483 1154 477
      1202 515 1230 520 1265 542 1310 549 1354 570 1380 563 1444 599
      1478 600 1551 649 1680 673V940H410Z"/>
    <path fill="#64766e" opacity=".25" d="M1048 430L1021 482 998 503 987 532
      956 556 942 583 891 627 842 669 1178 706 1140 612 1115 591
      1096 541 1070 516 1081 487 1063 464Z"/>
    <path fill="#d5c9a4" opacity=".2" d="M1048 430L1014 442 993 437 955 455
      931 450 885 471 858 474 800 489 842 495 900 484 946 476 979 466
      970 490 1004 469 1023 455Z"/>
    <path fill="#798174" opacity=".2" d="M1154 477L1141 514 1148 542 1129 559
      1170 624 1320 680 1259 586 1202 541 1197 521Z"/>
    <path fill="#c4c6a9" opacity=".17" d="M800 489L779 528 744 554 726 590
      689 623 657 665 855 650 824 598 804 560 821 535Z"/>
  </g>

  <!-- 6 / Near cloud sea: deep continuous sheets with fine filled light rims. -->
  <g id="near-cloud-layer" filter="url(#near-air)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-3520 0"
                        dur="131s" begin="-23s" calcMode="linear" repeatCount="indefinite"/>
      <rect x="-80" y="0" width="5280" height="1100" fill="url(#near-sea)"/>
    </g>
  </g>

  <!-- 7 / Foreground cliff: all geometry, shading and grain remain still. -->
  <g id="rock-layer" filter="url(#stone-grain)">
    <path fill="url(#rock-color)" d="M-40 554L27 551 61 535 111 544 157 529
      195 520 229 536 248 557 283 564 312 593 342 607 363 651 393 674
      417 716 446 739 463 780 500 807 522 857 560 900V960H-40Z"/>
    <path fill="url(#rock-light)" d="M-40 554L27 551 61 535 111 544 157 529
      195 520 177 550 142 567 127 604 102 634 83 684 56 711 35 766
      -8 824-40 836Z"/>
    <path fill="#b2a07a" opacity=".19" d="M195 520L229 536 248 557 283 564
      312 593 288 583 263 580 238 568 222 545 202 539 179 556 146 565Z"/>
    <path fill="#303f37" opacity=".36" d="M179 556L194 583 182 617 201 649
      206 691 241 754 230 782 267 859 264 932 350 947 308 846 279 791
      272 739 234 685 228 637 201 597 202 539Z"/>
    <path fill="#aba080" opacity=".12" d="M248 557L238 588 263 627 276 672
      304 705 321 758 353 797 368 851 397 900 419 916 394 845 369 784
      351 736 323 692 307 645 280 600 283 564Z"/>
    <path fill="#253d34" opacity=".25" d="M342 607L340 647 359 688 358 716
      387 765 398 810 431 854 443 911 478 938 458 851 427 797 412 747
      388 714 379 683 363 651Z"/>
    <path fill="#bdad87" opacity=".1" d="M61 535L75 571 64 610 79 642
      68 680 86 724 71 770 93 829 99 907 126 931 121 816 102 767
      114 727 89 668 94 631 79 598 89 570 111 544Z"/>
    <path fill="#2d3c32" opacity=".29" d="M142 567L125 619 130 648 110 696
      111 746 92 784 99 824 77 901 81 934 109 867 114 806 129 758
      126 704 145 659 140 622 154 579Z"/>
    <path fill="#d2bd8d" opacity=".16" d="M27 551L61 535 111 544 100 548
      63 542 35 558-12 565-40 565-40 558Z"/>
    <path fill="#cbbb92" opacity=".12" d="M312 593L342 607 363 651 352 637
      336 615 318 611 300 600 284 594Z"/>
  </g>

  <!-- 8 / Global mist: independent 47 s opacity breathing, with no translation. -->
  <g id="mist-layer" opacity=".09">
    <path fill="url(#mist-color)" d="M0 0H1600V900H0Z"/>
    <animate attributeName="opacity" values=".065;.135;.065" keyTimes="0;.5;1"
             keySplines=".42 0 .58 1;.42 0 .58 1" calcMode="spline"
             dur="47s" begin="-11s" repeatCount="indefinite"/>
  </g>
</svg>
